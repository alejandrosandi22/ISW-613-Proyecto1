# Base de datos de SIGEL (MariaDB) y phpMyAdmin en contenedores aislados.
# Puertos distintos a los estándar para no interferir con otras bases de datos locales.
# Los puertos se publican solo en 127.0.0.1 (no accesibles desde la red).
name: sigel

services:
  db:
    image: mariadb:11.4
    container_name: sigel-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD en .env}
      SIGEL_DB_USER: ${DB_APP_USER:?Defina DB_APP_USER en .env}
      SIGEL_DB_PASSWORD: ${DB_APP_PASSWORD:?Defina DB_APP_PASSWORD en .env}
      TZ: America/Costa_Rica
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - sigel-db-data:/var/lib/mysql
      # Scripts del repositorio (solo lectura).
      - ./sql:/sigel-sql:ro
      # Script de inicialización: se ejecuta solo cuando el volumen está vacío.
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: sigel-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 20M
    ports:
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sigel-db-data:
